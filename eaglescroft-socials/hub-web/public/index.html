<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#001E60">
<title>Content Hub</title>
<link rel="icon" href="brand/favicon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Raleway:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <img class="eagle" src="brand/eagle-white.svg" alt="" width="40">
      <span class="name">EAGLESCROFT</span>
      <span class="sp"></span>
      <div class="weeknav" aria-label="Week">
        <button id="prevWeek" aria-label="Previous week"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <span id="weekLabel" class="mono">Week</span>
        <button id="nextWeek" aria-label="Next week"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="eyebrow mono"><svg viewBox="0 0 30 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="15" cy="11" r="4.6"/><path d="M1.5 11H10.2M19.8 11H28.5M15 6.4V1.6"/></svg>Posting desk</div>
    <h1>Content Hub</h1>
    <div class="sub" id="weekRange">Loading the week…</div>
  </div>
</header>

<main class="wrap">
  <div class="panel controls">
    <div class="seg" role="group" aria-label="Account">
      <button data-acc="eaglescroft" aria-pressed="true">EAGLESCROFT</button>
      <button data-acc="joshua" aria-pressed="false">Joshua Obaje</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="notice" id="notice" hidden></div>
  <div class="list" id="list"><div class="panel loading">Loading posts…</div></div>

  <section class="section panel box feedback" aria-labelledby="fbH">
    <div>
      <h3 id="fbH">Feedback for Claude</h3>
      <p style="color:var(--muted);margin:4px 0 0">Your decisions and notes are saved on this device. Copy them and paste into our chat when you want changes. Send screenshots and photos in the chat too.</p>
    </div>
    <label for="general" style="font-weight:600;font-size:14px">Anything else for this week</label>
    <textarea id="general" placeholder="e.g. Thursday: the video agent rendered its first full scene. What broke: the voice timing."></textarea>
    <label class="sr" for="fbText">Feedback to send</label>
    <textarea id="fbText" readonly></textarea>
    <div class="row"><button class="btn primary" id="fbCopy">Copy feedback for Claude</button><span class="saved" id="fbState"></span></div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Full-size graphic"><img id="lbImg" alt=""><button id="lbClose">Close</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
