<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="es-size" content="1600x1660">
<title>Heading font comparison</title>
<style>
/* Eaglescroft social graphics: shared tokens + building blocks.
   Values mirror the Eaglescroft brand system. Do not hand-type new colours. */
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap");

:root {
  --navy: #001E60; --navy-600: #001A54; --navy-900: #000A22; --navy-400: #2F5AA3;
  --navy-50: #E6EBF5; --navy-100: #C0CDE6;
  --accent: #2563EB; --accent-500: #1D4ED8; --accent-300: #93C5FD; --accent-100: #DBEAFE; --accent-50: #EFF6FF;
  --indigo: #2A3F8F;
  --ink: #0B1530; --body: #48526E; --muted: #5A6685; --faint: #7A86A3;
  --wash: #F4F6FB; --wash-hero: #EEF2FB; --border: #E7EAF3; --border-navy: rgba(0,30,96,0.10);
  --dark: #020A24; --dark-2: #030D2E;
  --on-dark: rgba(255,255,255,0.92); --on-dark-muted: rgba(255,255,255,0.62);

  --grad-deep: linear-gradient(135deg, #000A22 0%, #001E60 45%, #2A3F8F 100%);
  --grad-section-dark: radial-gradient(70% 50% at 50% 0%, rgba(37,99,235,0.18) 0%, transparent 60%),
                       linear-gradient(180deg, #030D2E 0%, #001033 55%, #020A24 100%);
  --grad-hero-wash: radial-gradient(120% 90% at 80% 0%, #FFFFFF 0%, #EEF2FB 42%, #DFE7F7 100%);
  --grad-cta: linear-gradient(180deg, #3B76F0 0%, #1D4ED8 100%);
  --grad-text: linear-gradient(100deg, #1D4ED8, #2563EB 60%, #3B82F6);
  --grad-text-dark: linear-gradient(100deg, #93C5FD, #60A5FA 50%, #3B82F6);

  --font-display: "Poppins", system-ui, sans-serif;
  --font-body: "Raleway", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --shadow-soft: 0 1px 2px rgba(9,30,66,0.06), 0 8px 24px rgba(9,30,66,0.08);
  --shadow-medium: 0 2px 4px rgba(9,30,66,0.06), 0 18px 40px rgba(9,30,66,0.12);
  --shadow-accent: 0 10px 30px rgba(37,99,235,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; background: #fff; }

/* A canvas = one exported image. Size it per template. */
.canvas { position: relative; overflow: hidden; }
.canvas.dark  { background: var(--grad-section-dark); color: var(--on-dark); }
.canvas.deep  { background: var(--grad-deep); color: var(--on-dark); }
.canvas.light { background: var(--grad-hero-wash); color: var(--ink); }
.canvas.white { background: #fff; color: var(--ink); }

/* Dot-grid texture, masked to fade */
.dots::before, .dots-dark::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(80% 70% at 70% 20%, #000 0%, transparent 75%);
          mask-image: radial-gradient(80% 70% at 70% 20%, #000 0%, transparent 75%);
}
.dots::before      { background-image: radial-gradient(rgba(0,30,96,0.13) 1.4px, transparent 1.6px); }
.dots-dark::before { background-image: radial-gradient(rgba(255,255,255,0.10) 1.4px, transparent 1.6px); }

/* Eagle watermark (eagle PNGs carry padding; these offsets compensate) */
.watermark { position: absolute; pointer-events: none; opacity: 0.06; }

/* Type */
.eyebrow {
  font-family: var(--font-mono); font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--accent);
  display: inline-flex; align-items: center; gap: 0.7em;
}
.eyebrow::before { content: ""; width: 2.2em; height: 2px; background: currentColor; opacity: 0.8; }
.dark .eyebrow, .deep .eyebrow { color: var(--accent-300); }

.headline { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.03em; line-height: 1.04; margin: 0; }
.dark .headline, .deep .headline { color: #fff; }
.light .headline, .white .headline { color: var(--navy); }
.ink { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dark .ink, .deep .ink { background-image: var(--grad-text-dark); }

.lead { font-family: var(--font-body); font-weight: 500; line-height: 1.45; margin: 0; }
.dark .lead, .deep .lead { color: var(--on-dark-muted); }
.light .lead, .white .lead { color: var(--body); }

.mono { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.16em; }

/* Pills and cards */
.pill {
  display: inline-flex; align-items: center; gap: 0.5em; border-radius: 9999px;
  font-family: var(--font-body); font-weight: 600;
  background: var(--grad-cta); color: #fff; box-shadow: var(--shadow-accent);
}
.chip {
  display: inline-flex; align-items: center; gap: 0.5em; border-radius: 9999px;
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 500;
  border: 1px solid var(--border-navy); background: rgba(255,255,255,0.7); color: var(--navy);
}
.dark .chip, .deep .chip { border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: var(--on-dark); }
.dot-live { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0.3em rgba(37,99,235,0.2); }

.card {
  background: #fff; border: 1px solid var(--border-navy); border-radius: 24px; box-shadow: var(--shadow-soft);
}
.dark .card, .deep .card { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.12); box-shadow: none; }

/* Footer brand bar */
.brandbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; }
.brandbar img { display: block; }
.brandbar .mono { color: var(--faint); }
.dark .brandbar .mono, .deep .brandbar .mono { color: var(--on-dark-muted); }

</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
  /* Same layout, same Raleway body. Only the heading family changes per row.
     Cottorway Pro is a commercial font: it renders from the viewer's installed copy. */
  .sheet { width: 1600px; padding: 64px 72px 56px; background: var(--wash); }
  .sheet > header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 36px; }
  .sheet > header h1 { font-family: var(--font-body); font-weight: 600; font-size: 34px; color: var(--navy); margin: 0; letter-spacing: -0.01em; }
  .sheet > header .mono { font-size: 15px; color: var(--faint); }

  .row { display: grid; grid-template-columns: 1fr 1fr; border-radius: 28px; overflow: hidden; margin-bottom: 28px;
         box-shadow: var(--shadow-medium); position: relative; height: 470px; }
  .row .panel { position: relative; padding: 54px 56px; overflow: hidden; }
  .panel.dark { background: var(--grad-section-dark); color: var(--on-dark); }
  .row .watermark { width: 520px; right: -150px; bottom: -110px; }
  .tag { position: absolute; top: 22px; right: 26px; font-size: 13px; padding: 9px 14px; z-index: 2; }

  .h { font-family: var(--h-font); font-weight: var(--h-weight); letter-spacing: var(--h-track); line-height: 1.04; margin: 0; }
  .eyebrow { font-size: 15px; }
  .hero-h { font-size: 62px; margin-top: 26px; color: #fff; }
  .hero-p { font-size: 21px; margin-top: 22px; max-width: 560px; }

  .light-panel { background: #fff; }
  .card-h { font-size: 44px; color: var(--navy); }
  .card-p { font-family: var(--font-body); font-size: 19px; line-height: 1.55; color: var(--body); margin: 16px 0 0; max-width: 600px; }
  .stats { display: flex; gap: 44px; margin-top: 30px; }
  .stat .n { font-family: var(--h-font); font-weight: 700; letter-spacing: -0.03em; font-size: 54px; color: var(--accent); line-height: 1; }
  .stat .l { font-family: var(--font-body); font-size: 15px; color: var(--muted); margin-top: 8px; }
  .cta { margin-top: 30px; font-size: 18px; padding: 15px 28px; }
  .alpha { font-family: var(--h-font); font-weight: var(--h-weight); color: var(--faint); font-size: 20px; letter-spacing: 0.02em; margin-top: 26px; }

  .missing { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; text-align: center;
             background: var(--grad-deep); color: #fff; font-family: var(--font-body); font-size: 26px; line-height: 1.5; padding: 40px; }
  .missing b { font-family: var(--font-display); font-weight: 600; display: block; font-size: 34px; margin-bottom: 8px; }
  .row.is-missing .missing { display: flex; }

  .sora       { --h-font: "Sora", sans-serif;       --h-weight: 600; --h-track: -0.03em; }
  .montserrat { --h-font: "Montserrat", sans-serif; --h-weight: 600; --h-track: -0.025em; }
  .cottorway  { --h-font: "Cottorway Pro", "Cottorway Pro Display", "Cottorway", sans-serif; --h-weight: 500; --h-track: -0.02em; }
</style>

<script>
  const tpl = document.getElementById('row');
  document.querySelectorAll('.row').forEach(row => {
    row.appendChild(tpl.content.cloneNode(true));
    const tag = document.createElement('span');
    tag.className = 'chip tag';
    tag.textContent = row.dataset.label;
    row.appendChild(tag);
    const miss = document.createElement('div');
    miss.className = 'missing';
    miss.innerHTML = '<div><b>' + row.dataset.font + ' isn’t installed on this device.</b>Open this file in Chrome or Edge on the computer where it’s installed.</div>';
    row.appendChild(miss);
  });

  // A font is present if text set in it measures differently from both generic fallbacks.
  function installed(names) {
    const c = document.createElement('canvas').getContext('2d');
    const s = 'Eaglescroft flies online 0123456789';
    const w = f => { c.font = '500 72px ' + f; return c.measureText(s).width; };
    const mono = w('monospace'), serif = w('serif');
    return names.some(n => w('"' + n + '", monospace') !== mono || w('"' + n + '", serif') !== serif);
  }
  document.fonts.ready.then(() => {
    const row = document.querySelector('.row.cottorway');
    if (!installed(['Cottorway Pro', 'Cottorway Pro Display', 'Cottorway'])) row.classList.add('is-missing');
  });
</script>
