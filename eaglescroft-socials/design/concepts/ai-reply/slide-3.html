<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../../../">
<meta name="es-size" content="1080x1350">
<title>Concept · AI reply · 3 CTA</title>
<link rel="stylesheet" href="design/templates/shared.css">
<link rel="stylesheet" href="design/icons/icons.css">
<link rel="stylesheet" href="design/concepts/ai-reply/concept.css">
<style>
  .hl { font-size: 70px; margin-top: 70px; }
  .lead { font-size: 27px; margin-top: 26px; max-width: 640px; }
  /* Glassy 3D eagle badge */
  .badge-wrap { position: absolute; left: 50%; top: 640px; transform: translateX(-50%); width: 420px; height: 420px; z-index: 2; perspective: 900px; }
  .badge { width: 100%; height: 100%; border-radius: 50%; transform: rotateY(-16deg) rotateX(8deg);
    background: radial-gradient(60% 60% at 35% 28%, #93C5FD 0%, #3B82F6 32%, #1D4ED8 62%, #001E60 100%);
    box-shadow: inset 0 0 0 10px rgba(255,255,255,0.18), inset -24px -30px 60px rgba(0,10,34,0.55), inset 18px 22px 40px rgba(255,255,255,0.35),
                0 50px 80px -20px rgba(0,5,20,0.75), 0 0 120px rgba(59,130,246,0.45);
    display: flex; align-items: center; justify-content: center; position: relative; }
  .badge::after { content: ""; position: absolute; left: 14%; top: 8%; width: 46%; height: 24%; border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0)); transform: rotate(-20deg); }
  .badge img { width: 62%; filter: drop-shadow(0 10px 16px rgba(0,10,34,0.5)); transform: translate(6px, -4px); }
  .float { font-size: 20px; padding: 13px 20px 13px 13px; }
  .float .tile { width: 40px; height: 40px; font-size: 21px; }
  .c1 { left: 70px; top: 690px; transform: rotate(-4deg); }
  .c2 { right: 60px; top: 760px; transform: rotate(3deg); }
  .c3 { left: 110px; top: 960px; transform: rotate(2deg); }
  .cta { position: absolute; left: 50%; transform: translateX(-50%); bottom: 190px; z-index: 3; font-size: 26px; padding: 22px 40px; display: inline-flex; gap: 12px; align-items: center; white-space: nowrap; }
</style>
</head>
<body>
<div class="canvas vivid grid">
  <div class="topbar">
    <div class="brand"><img src="design/brand/eagle-white-mark.png" alt=""><span>EAGLESCROFT</span></div>
    <div class="eyebrow">Ready for takeoff</div>
  </div>

  <h2 class="hl"><span class="thin">Let’s build your</span><span class="heavy blue">24/7 assistant.</span></h2>
  <p class="lead">We set it up, train it on your business and hand it over ready to fly.</p>

  <div class="badge-wrap"><div class="badge"><img src="design/brand/eagle-white-mark.png" alt=""></div></div>

  <div class="float c1"><span class="tile"><span class="ic i-message-circle"></span></span>Answers FAQs instantly</div>
  <div class="float c2"><span class="tile" style="background:var(--navy)"><span class="ic i-database"></span></span>Captures every lead</div>
  <div class="float c3"><span class="tile"><span class="ic i-shield-check"></span></span>Hands over to a human</div>

  <span class="pill cta">Book a free call <span class="ic i-arrow-right"></span></span>
  <div class="footbar">
    <div class="site"><span class="ic i-globe"></span>eaglescroft.com.ng</div>
    <div class="socials">
      <span><span class="ic i-linkedin"></span></span>
      <span><span class="ic i-facebook"></span></span>
      <span><span class="ic i-x"></span></span>
    </div>
  </div>
</div>
</body>
</html>
