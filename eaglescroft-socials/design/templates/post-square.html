<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Paths resolve from the eaglescroft-socials root. In posts/YYYY-MM/<slug>/ use href="../../../" -->
<base href="../../">
<meta name="es-size" content="1080x1080">
<title>Post · Square</title>
<link rel="stylesheet" href="design/templates/shared.css">
<style>
  .canvas { width: 1080px; height: 1080px; padding: 96px 88px; }
  .watermark { width: 900px; right: -230px; bottom: -120px; }
  .eyebrow { font-size: 22px; }
  .headline { font-size: 104px; margin-top: 48px; max-width: 880px; }
  .lead { font-size: 34px; margin-top: 40px; max-width: 800px; }
  .chips { display: flex; gap: 14px; margin-top: 56px; flex-wrap: wrap; }
  .chip { font-size: 17px; padding: 14px 22px; }
  .brandbar { padding: 0 88px 72px; }
  .brandbar .mark { height: 46px; }
  .brandbar .left { display: flex; align-items: center; gap: 18px; }
  .brandbar .mono { font-size: 18px; }
</style>
</head>
<body>
<div class="canvas dark dots-dark">
  <img class="watermark" src="design/brand/eagle-white-mark.png" alt="">

  <div class="eyebrow">Hangar notes</div>
  <h1 class="headline">We don’t just talk about AI. We <span class="ink">run on it</span>.</h1>
  <p class="lead">Real tools. Real workflows. No hype. Here’s how AI works inside Eaglescroft, every day.</p>

  <div class="chips">
    <span class="chip"><span class="dot-live"></span>Research</span>
    <span class="chip">Build</span>
    <span class="chip">Automate</span>
    <span class="chip">Create</span>
  </div>

  <div class="brandbar">
    <div class="left">
      <img class="mark" src="design/brand/eagle-white-mark.png" alt="Eaglescroft">
      <span class="mono">Eaglescroft</span>
    </div>
    <span class="mono">eaglescroft.com.ng</span>
  </div>
</div>
</body>
</html>
