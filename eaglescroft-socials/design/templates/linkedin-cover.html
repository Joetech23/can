<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../../">
<meta name="es-size" content="1128x191">
<title>Cover · LinkedIn company page</title>
<link rel="stylesheet" href="design/templates/shared.css">
<style>
  /* The company logo overlaps the bottom-left on desktop: keep content right of ~260px. */
  .canvas { width: 1128px; height: 191px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px 0 300px; }
  .watermark { width: 420px; left: -40px; top: -90px; opacity: 0.08; }
  .eyebrow { font-size: 11px; }
  .eyebrow::before { width: 1.6em; }
  .headline { font-size: 30px; margin-top: 10px; line-height: 1.1; }
  .side { text-align: right; }
  .side .mono { display: block; white-space: nowrap; font-size: 11px; color: var(--on-dark-muted); line-height: 2; }
  .side .mono b { color: var(--accent-300); font-weight: 500; }
</style>
</head>
<body>
<div class="canvas dark dots-dark">
  <img class="watermark" src="design/brand/eagle-white-mark.png" alt="">
  <div>
    <div class="eyebrow">Practical AI for business</div>
    <h1 class="headline">We help businesses<br><span class="ink">fly online</span>.</h1>
  </div>
  <div class="side">
    <span class="mono">Websites · AI chatbots · Automation</span>
    <span class="mono">CRM · Video · Branding</span>
    <span class="mono"><b>eaglescroft.com.ng</b></span>
  </div>
</div>
</body>
</html>
