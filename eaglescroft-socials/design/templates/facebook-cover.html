<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../../">
<meta name="es-size" content="1640x624">
<title>Cover · Facebook page</title>
<link rel="stylesheet" href="design/templates/shared.css">
<style>
  /* Mobile crops the sides: keep all copy inside the centre ~1100px. */
  .canvas { width: 1640px; height: 624px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .watermark { width: 900px; right: -160px; bottom: -220px; opacity: 0.06; }
  .watermark.l { left: -260px; top: -260px; right: auto; bottom: auto; width: 700px; transform: scaleX(-1); opacity: 0.04; }
  .copy { max-width: 1100px; display: flex; flex-direction: column; align-items: center; }
  .eyebrow { font-size: 20px; }
  .headline { font-size: 70px; margin-top: 24px; }
  .lead { font-size: 30px; margin-top: 22px; }
  .reassure { margin-top: 34px; font-size: 16px; color: var(--on-dark-muted); }
</style>
</head>
<body>
<div class="canvas dark dots-dark">
  <img class="watermark l" src="design/brand/eagle-white-mark.png" alt="">
  <img class="watermark" src="design/brand/eagle-white-mark.png" alt="">
  <div class="copy">
    <div class="eyebrow">Eaglescroft · Abuja, Nigeria</div>
    <h1 class="headline">We help businesses<br><span class="ink">fly online</span>.</h1>
    <p class="lead">Websites, AI chatbots and automation. Practical AI, no hype.</p>
    <div class="mono reassure">Abuja to the world · eaglescroft.com.ng</div>
  </div>
</div>
</body>
</html>
